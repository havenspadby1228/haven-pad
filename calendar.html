header{background:linear-gradient(180deg,#241A13,var(--espresso));color:var(--cream);padding:18px 20px;box-shadow:0 4px 18px rgba(46,33,25,.35)}
.brand{display:flex;align-items:center;gap:12px;max-width:1400px;margin:0 auto}
.brand img{width:46px;height:46px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.brand h1{font-family:'Playfair Display',serif;font-weight:600;font-size:1.2rem;letter-spacing:.03em;color:var(--gold-soft)}
.brand h1 span{display:block;font-family:'Nunito Sans';font-size:.62rem;font-weight:700;letter-spacing:.3em;color:var(--amber);text-transform:uppercase;margin-top:2px}
main{max-width:1400px;margin:0 auto;padding:26px 16px}
p.sub{color:var(--muted-text);font-size:.88rem;margin-bottom:20px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.calhead{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.calhead h2{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:600;min-width:180px;text-align:center}
.btn{appearance:none;border:1.5px solid var(--muted-text);background:transparent;color:var(--ink);border-radius:10px;padding:8px 14px;font:700 .8rem 'Nunito Sans';cursor:pointer}
.btn.dark{background:var(--espresso);color:var(--gold-soft);border:none}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dow{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-text);text-align:center;padding:6px 0}
.day{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:150px;padding:10px;position:relative}
.day.out{opacity:.32}
.day.today{border:2px solid var(--terracotta)}
.day .n{font-size:.78rem;font-weight:800;color:var(--muted-text)}
.tag{font-size:.74rem;font-weight:800;color:#fff;border-radius:7px;padding:5px 8px;margin-top:7px;text-align:center}
.tag.open{background:var(--ok)}
.tag.busy{background:var(--bad)}
.win{font-size:.68rem;color:var(--muted-text);margin-top:5px;line-height:1.4;text-align:center}
.segtag{font-size:.7rem;font-weight:800;color:#fff;border-radius:7px;padding:4px 7px;margin-top:5px;text-align:center;line-height:1.4}
.heart{text-align:center;opacity:.34;font-size:1.3rem;margin-top:24px}
.daynote{text-align:center;margin-top:14px}
.daynote .emoji{font-size:1.4rem;opacity:.65}
.daynote .emoji.dim{opacity:.34}
.daynote .emoji.small{font-size:1.05rem}
.daynote .caption{font-size:.74rem;font-weight:800;color:var(--terracotta);margin-top:4px}
.daynote .caption.muted{color:var(--muted-text)}
.legend{display:flex;gap:16px;justify-content:center;margin-top:16px;font-size:.76rem;font-weight:700}
.legend .it{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.loading{text-align:center;padding:40px;color:var(--muted-text)}
.overlay{position:fixed;inset:0;background:rgba(46,33,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
@media(min-width:700px){.overlay{align-items:center;padding:20px}}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;max-width:480px;width:100%;max-height:82vh;overflow-y:auto;padding:24px;box-shadow:0 -8px 40px rgba(0,0,0,.3)}
@media(min-width:700px){.modal{border-radius:20px}}
.modal h3{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:600;margin-bottom:4px}
.modal .sub2{font-size:.78rem;color:var(--muted-text);margin-bottom:16px}
.seglist{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.segrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#fff;font-weight:800;font-size:.86rem}
.freebox{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.freebox b{font-size:1rem}
.modal .closebtn{appearance:none;border:1.5px solid var(--muted-text);background:transparent;color:var(--ink);border-radius:10px;padding:10px 18px;font:700 .85rem 'Nunito Sans';cursor:pointer;width:100%;margin-top:8px}
.day{cursor:pointer}

/* ===== Responsive breakpoints ===== */
@media(max-width:700px){
  main{padding:18px 10px}
  .card{padding:16px 10px}
  .brand{gap:9px}
  .brand img{width:38px;height:38px;border-radius:9px}
  .brand h1{font-size:1rem}
  .brand h1 span{font-size:.56rem}
  .calhead{gap:8px;margin-bottom:14px}
  .calhead h2{font-size:1.15rem;min-width:130px}
  .btn{padding:7px 10px;font-size:.72rem;border-radius:8px}
  .calgrid{gap:5px}
  .dow{font-size:.58rem;padding:4px 0}
  .day{min-height:104px;padding:6px 4px;border-radius:9px}
  .day .n{font-size:.7rem}
  .tag{font-size:.6rem;padding:4px 4px;margin-top:5px;border-radius:6px}
  .segtag{font-size:.56rem;padding:3px 4px;margin-top:4px;border-radius:6px;line-height:1.3}
  .win{font-size:.56rem;margin-top:3px}
  .daynote{margin-top:8px}
  .daynote .emoji{font-size:1.05rem}
  .daynote .emoji.small{font-size:.85rem}
  .daynote .caption{font-size:.56rem;margin-top:3px}
  .legend{flex-wrap:wrap;row-gap:6px;column-gap:12px;font-size:.68rem}
}
@media(max-width:420px){
  main{padding:14px 6px}
  .card{padding:12px 6px}
  .calgrid{gap:3px}
  .day{min-height:88px;padding:5px 3px;border-radius:8px}
  .day .n{font-size:.64rem}
  .dow{font-size:.5rem}
  .tag{font-size:.52rem;padding:3px 2px}
  .segtag{font-size:.48rem;padding:2px 3px}
  .win{font-size:.48rem}
  .calhead h2{font-size:1rem;min-width:100px}
  .btn{padding:6px 8px;font-size:.66rem}
}
@media(max-width:340px){
  .day{min-height:76px}
  .segtag{display:none} /* keep it from overflowing on very small phones — the "+N more" / hour badge still shows */
  .day .tag{margin-top:5px}
}
</style>
</head>

<main>
  <p class="sub">Check open dates and hours below. To book, message us directly — this page does not take reservations.</p>
  <div class="card">
    <div class="calhead">

  <div class="modal">
    <h3 id="dayTitle"></h3>

    <div id="dayBody"></div>
    <button class="closebtn" id="dayClose">Close</button>
  </div>
</div>
<script>
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbxbCJx_Q6BEthE6nD8IJFjOvp_oMp57xF8BOjQPI6irSOyByM-2twKbX1_0ahQek42mHw/exec';
let bookings = [], blocks = [];
let calY = new Date().getFullYear(), calM = new Date().getMonth();
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return isoLocal(new Date()); }
function timeToMin(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function minToHHMM(min){ min=((min%1440)+1440)%1440; const h=Math.floor(min/60), m=min%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function time12(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; const hh=h%12||12; return hh+(m?':'+String(m).padStart(2,'0'):':00')+' '+ap; }

function busyIntervalsForDay(iso){
  const busy=[];
  bookings.filter(b=>b.ciD<=iso&&iso<=b.coD).forEach(b=>{
    let s = b.ciD===iso ? (timeToMin(b.ciT)||0) : 0;
    let e = b.coD===iso ? (timeToMin(b.coT)||0) : 1440;
    if(e>s) busy.push([s,e]);
  });
  blocks.filter(k=>k.startD<=iso&&iso<=k.endD).forEach(k=>{
    let s = k.startD===iso ? (timeToMin(k.startT)||0) : 0;
    let e = k.endD===iso ? (timeToMin(k.endT)||0) : 1440;
    if(e>s) busy.push([s,e]);
  });
  busy.sort((a,b)=>a[0]-b[0]);
  const merged=[];
  busy.forEach(iv=>{
    if(merged.length && iv[0]<=merged[merged.length-1][1]) merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],iv[1]);
    else merged.push(iv.slice());
  });
  return merged;
}
const BOOKING_COLORS=['#C96F4A','#8A5A83','#4A6B8A','#C09A4D','#8A3B3B','#5C6B8A','#96604A'];
const BLOCK_COLOR='#4A3526';
function rawSegmentsForDay(iso){
  const segs=[];
  bookings.filter(b=>b.ciD<=iso&&iso<=b.coD).forEach(b=>{
    let s = b.ciD===iso ? (timeToMin(b.ciT)||0) : 0;
    let e = b.coD===iso ? (timeToMin(b.coT)||0) : 1440;
    if(e>s) segs.push({start:s,end:e,kind:'booking'});
  });
  blocks.filter(k=>k.startD<=iso&&iso<=k.endD).forEach(k=>{
    let s = k.startD===iso ? (timeToMin(k.startT)||0) : 0;
    let e = k.endD===iso ? (timeToMin(k.endT)||0) : 1440;
    if(e>s) segs.push({start:s,end:e,kind:'block'});
  });
  segs.sort((a,b)=>a.start-b.start);
  return segs;
}
function availabilityForDay(iso){
  const busy=busyIntervalsForDay(iso);
  const free=[]; let cursor=0;
  busy.forEach(iv=>{ if(iv[0]>cursor) free.push([cursor,iv[0]]); cursor=Math.max(cursor,iv[1]); });
  if(cursor<1440) free.push([cursor,1440]);
  const totalMin=free.reduce((a,iv)=>a+(iv[1]-iv[0]),0);
  return {free,totalMin};
}

const MONTHS_FULL=MONTHS;
function fmtDateLong_(iso){
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}
function openDayModal_(iso){
  const tISO=todayStr();
  document.getElementById('dayTitle').textContent=fmtDateLong_(iso);
  const segs=rawSegmentsForDay(iso);
  let html='';

  if(iso<tISO){
    const hasBooking=segs.some(s=>s.kind==='booking');
    const hasBlock=segs.some(s=>s.kind==='block');
    if(hasBooking){
      html+='<div class="freebox"><b style="color:var(--bad)">Fully booked</b><div style="font-size:.8rem;color:var(--muted-text);margin-top:4px">This date is in the past and was booked.</div></div>';
    } else if(hasBlock){
      html+='<div class="freebox"><b>🧹 Cleaning / Maintenance</b><div style="font-size:.8rem;color:var(--muted-text);margin-top:4px">This date was reserved for upkeep, not a guest stay.</div></div>';
    } else {
      html+='<div class="freebox"><b>💔 No booking on record</b><div style="font-size:.8rem;color:var(--muted-text);margin-top:4px">This past date had no reservation.</div></div>';
    }
  } else {
    const av=availabilityForDay(iso);
    const FULLY_BOOKED_THRESHOLD_MIN=360;
    if(av.totalMin<=FULLY_BOOKED_THRESHOLD_MIN){
      html+='<div class="freebox"><b style="color:var(--bad)">Fully booked</b><div style="font-size:.8rem;color:var(--muted-text);margin-top:4px">No meaningful open window remains this date.</div></div>';
    } else if(av.totalMin>=1440){
      html+='<div class="freebox"><b style="color:var(--ok)">Open all day</b><div style="font-size:.8rem;color:var(--muted-text);margin-top:4px">No bookings or reservations yet — this date is wide open.</div></div>';
    } else {
      const MIN_DISPLAY_WINDOW_MIN=30; // hide sub-30-minute slivers (buffer/cleaning gaps) — not real bookable windows
      const visibleWindows=av.free.filter(iv=>(iv[1]-iv[0])>=MIN_DISPLAY_WINDOW_MIN);
      html+='<div class="freebox"><b style="color:var(--ok)">'+(Math.round(av.totalMin/60*10)/10)+' hours free</b>'
        +'<div style="font-size:.8rem;color:var(--muted-text);margin-top:6px">'
        +(visibleWindows.length ? visibleWindows.map(iv=>time12(minToHHMM(iv[0]))+'–'+time12(minToHHMM(iv[1]))).join(' &nbsp;·&nbsp; ') : 'Scattered short gaps only')
        +'</div></div>';
    }
  }

  if(segs.length){
    html+='<div class="seglist">';
    let bIdx=0;
    segs.forEach(seg=>{
      const color = seg.kind==='block' ? BLOCK_COLOR : BOOKING_COLORS[bIdx++ % BOOKING_COLORS.length];
      html+='<div class="segrow" style="background:'+color+'">'
        +(seg.kind==='block'?'🔒 Reserved':'🏠 Booked')+'&nbsp;&nbsp;'
        +time12(minToHHMM(seg.start))+' – '+time12(minToHHMM(seg.end))
        +'</div>';
    });
    html+='</div>';
  }

  document.getElementById('dayBody').innerHTML=html;
  document.getElementById('dayOverlay').classList.add('show');
}
function render(){
  document.getElementById('title').textContent = MONTHS[calM]+' '+calY;
  const grid=document.getElementById('grid'); grid.innerHTML='';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{const e=document.createElement('div');e.className='dow';e.textContent=d;grid.appendChild(e);});
  const first=new Date(calY,calM,1), start=new Date(first); start.setDate(1-first.getDay());
  const tISO=todayStr();
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const iso=isoLocal(d);
    const cell=document.createElement('div'); cell.className='day'+(d.getMonth()!==calM?' out':'')+(iso===tISO?' today':'');
    cell.innerHTML='<div class="n">'+d.getDate()+'</div>';
    if(d.getMonth()===calM) cell.onclick=()=>openDayModal_(iso);
    if(d.getMonth()===calM){
      const segs=rawSegmentsForDay(iso);
      if(iso<tISO){
        // PAST: simple 3-state view — guests only need to know the shape of history, not exact hours
        const hasBooking = segs.some(s=>s.kind==='booking');
        const hasBlock = segs.some(s=>s.kind==='block');
        if(hasBooking){
          const t=document.createElement('div'); t.className='tag busy'; t.textContent='Fully booked'; cell.appendChild(t);
        } else if(hasBlock){
          const hb=document.createElement('div'); hb.className='daynote';
          hb.innerHTML='<div class="emoji">🧹</div><div class="caption muted">Cleaning / Maintenance</div>';
          cell.appendChild(hb);
        } else {
          const hb=document.createElement('div'); hb.className='daynote';
          hb.innerHTML='<div class="emoji dim small">💔</div>';
          cell.appendChild(hb);
        }
      } else {
        // TODAY / FUTURE: precise hour-based availability view
        const av=availabilityForDay(iso);
        const FULLY_BOOKED_THRESHOLD_MIN = 360; // 6 hours or less counts as effectively fully booked
        if(av.totalMin<=FULLY_BOOKED_THRESHOLD_MIN){
          const t=document.createElement('div'); t.className='tag busy'; t.textContent='Fully booked'; cell.appendChild(t);
        } else if(av.totalMin>=1440){
          if(iso>tISO){
            const hb=document.createElement('div'); hb.className='daynote';
            hb.innerHTML='<div class="emoji">😉</div><div class="caption">I-book mo na!</div>';
            cell.appendChild(hb);
          } else {
            const t=document.createElement('div'); t.className='tag open'; t.textContent='Open all day'; cell.appendChild(t);
          }
        } else {
          const t=document.createElement('div'); t.className='tag open'; t.textContent=(Math.round(av.totalMin/60*10)/10)+'h free'; cell.appendChild(t);
          let bIdx=0;
          segs.slice(0,3).forEach(seg=>{
            const color = seg.kind==='block' ? BLOCK_COLOR : BOOKING_COLORS[bIdx++ % BOOKING_COLORS.length];
            const p=document.createElement('div'); p.className='segtag'; p.style.background=color;
            p.textContent=(seg.kind==='block'?'🔒 ':'')+time12(minToHHMM(seg.start))+'–'+time12(minToHHMM(seg.end));
            cell.appendChild(p);
          });
          if(segs.length>2){
            const m=document.createElement('div'); m.className='win'; m.textContent='+'+(segs.length-2)+' more';
            cell.appendChild(m);
          }
        }
      }
    }
    grid.appendChild(cell);
  }
}

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='hp_pub_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const t=setTimeout(()=>{cleanup();reject(new Error('timed out'));},20000);
    function cleanup(){clearTimeout(t);try{delete window[cb];}catch(e){}s.remove();}
    window[cb]=d=>{cleanup();resolve(d);};
    s.onerror=()=>{cleanup();reject(new Error('network error'));};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.head.appendChild(s);
  });
}
async function loadData(){
  try{
    let j;
    const url = SYNC_URL + '?public=1';
    try{
      const res = await fetch(url);
      j = await res.json();
    }catch(e){ j = await jsonp(url); }
    if(!j.ok) throw new Error(j.error||'failed');
    bookings = j.bookings||[];
    blocks = j.blocks||[];
    document.getElementById('loadingMsg').style.display='none';
    document.getElementById('grid').style.display='grid';
    render();
  }catch(e){
    document.getElementById('loadingMsg').textContent='Could not load availability right now. Please try again shortly.';
  }
}
async function downloadCalendarImage(){
  await (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve());

  const COLS=7, ROWS=6;
  const cellW=150, cellH=138, marginX=24, marginTop=170, dowH=34, legendH=54;
  const W = marginX*2 + COLS*cellW;
  const H = marginTop + dowH + ROWS*cellH + legendH + 20;

  const canvas=document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const x=canvas.getContext('2d');

  const ESPRESSO='#2E2119', GOLD='#C09A4D', GOLDSOFT='#E3CFA0', AMBER='#E8B872',
        CREAM='#F6F0E4', CARD='#FDFAF3', INK='#31261D', MUTED='#8A7763',
        LINE='#E4D8C2', OK='#5E8A5A', BAD='#B0503C', TERRA='#C96F4A';

  // background
  x.fillStyle=CREAM; x.fillRect(0,0,W,H);

  // header band
  x.fillStyle=ESPRESSO; x.fillRect(0,0,W,90);
  const logoImg=document.querySelector('.brand img');
  try{
    x.save(); x.beginPath(); x.arc(52,45,26,0,Math.PI*2); x.clip();
    x.drawImage(logoImg,26,19,52,52); x.restore();
  }catch(e){}
  x.textAlign='left';
  x.fillStyle=GOLDSOFT; x.font='600 22px "Playfair Display", Georgia, serif';
  x.fillText('Haven Pad', 92, 40);
  x.fillStyle=AMBER; x.font='800 11px "Nunito Sans", sans-serif';
  x.fillText('B Y   1 2 2 8   ·   L I V E   A V A I L A B I L I T Y', 92, 60);

  // month title
  x.textAlign='center'; x.fillStyle=INK; x.font='600 26px "Playfair Display", Georgia, serif';
  x.fillText(MONTHS[calM]+' '+calY, W/2, 132);
  x.fillStyle=MUTED; x.font='600 12px "Nunito Sans", sans-serif';
  x.fillText('Generated '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' · haven-pad calendar', W/2, 152);

  // day-of-week row
  const dowY=marginTop;
  const DOWS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  x.font='800 11px "Nunito Sans", sans-serif'; x.fillStyle=MUTED;
  DOWS.forEach((d,i)=>{
    x.fillText(d, marginX + i*cellW + cellW/2, dowY+22);
  });

  // grid
  const first=new Date(calY,calM,1), start=new Date(first); start.setDate(1-first.getDay());
  const tISO=todayStr();
  const gridTop=dowY+dowH;

  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const iso=isoLocal(d);
    const row=Math.floor(i/7), col=i%7;
    const cx=marginX+col*cellW, cy=gridTop+row*cellH;
    const inMonth = d.getMonth()===calM;

    x.fillStyle = CARD; x.fillRect(cx,cy,cellW-6,cellH-6);
    x.strokeStyle=LINE; x.lineWidth=1; x.strokeRect(cx,cy,cellW-6,cellH-6);
    if(iso===tISO){ x.strokeStyle=TERRA; x.lineWidth=2; x.strokeRect(cx+1,cy+1,cellW-8,cellH-8); }

    x.textAlign='left';
    x.fillStyle = inMonth ? MUTED : '#C9BBA6';
    x.font='800 13px "Nunito Sans", sans-serif';
    x.fillText(String(d.getDate()), cx+10, cy+20);

    if(!inMonth) continue;

    const segs=rawSegmentsForDay(iso);
    let yy=cy+40;

    function tag(text,bg,fg){
      x.fillStyle=bg; roundRectCanvas_(x,cx+8,yy-14,cellW-22,20,5); x.fill();
      x.fillStyle=fg||'#fff'; x.textAlign='center'; x.font='800 11px "Nunito Sans", sans-serif';
      x.fillText(text, cx+8+(cellW-22)/2, yy);
      x.textAlign='left';
      yy+=26;
    }
    function sub(text,color){
      x.fillStyle=color||MUTED; x.textAlign='center'; x.font='600 10px "Nunito Sans", sans-serif';
      wrapCanvasText_(x, text, cx+(cellW-6)/2, yy, cellW-16, 12);
      yy+=14;
      x.textAlign='left';
    }

    if(iso<tISO){
      const hasBooking=segs.some(s=>s.kind==='booking');
      const hasBlock=segs.some(s=>s.kind==='block');
      if(hasBooking){ tag('Fully booked',BAD); }
      else if(hasBlock){ sub('🧹 Cleaning / Maintenance',MUTED); }
      else { x.textAlign='center'; x.font='16px serif'; x.fillText('💔', cx+cellW/2-3, cy+70); x.textAlign='left'; }
    } else {
      const av=availabilityForDay(iso);
      const THRESH=360;
      if(av.totalMin<=THRESH){ tag('Fully booked',BAD); }
      else if(av.totalMin>=1440){
        if(iso>tISO){ x.textAlign='center'; x.font='16px serif'; x.fillText('😉', cx+cellW/2-3, cy+66); x.textAlign='left'; sub('I-book mo na!',TERRA); }
        else { tag('Open all day',OK); }
      } else {
        tag((Math.round(av.totalMin/60*10)/10)+'h free', OK);
        let bIdx=0;
        segs.slice(0,2).forEach(seg=>{
          const color = seg.kind==='block' ? '#4A3526' : BOOKING_COLORS[bIdx++ % BOOKING_COLORS.length];
          const label=(seg.kind==='block'?'🔒 ':'')+time12(minToHHMM(seg.start))+'–'+time12(minToHHMM(seg.end));
          tag(label,color);
        });
        if(segs.length>2){ sub('+'+(segs.length-2)+' more',MUTED); }
      }
    }
  }

  // legend
  const legY=gridTop+ROWS*cellH+30;
  x.textAlign='left'; x.font='700 12px "Nunito Sans", sans-serif';
  const items=[[OK,'Available'],[BAD,'Fully booked'],[TERRA,'Booked time'],['','😉 Upcoming, unbooked'],['','💔 Past, unbooked']];
  let lx=marginX;
  items.forEach(([color,label])=>{
    if(color){ x.fillStyle=color; x.beginPath(); x.arc(lx+5,legY-4,5,0,Math.PI*2); x.fill(); lx+=16; }
    x.fillStyle=INK; x.fillText(label, lx, legY);
    lx += x.measureText(label).width + 24;
  });

  const a=document.createElement('a');
  a.href=canvas.toDataURL('image/png');
  a.download='HavenPad_Availability_'+MONTHS[calM]+'_'+calY+'.png';
  a.click();
}
function roundRectCanvas_(ctx,px,py,w,h,r){
  ctx.beginPath();
  ctx.moveTo(px+r,py); ctx.arcTo(px+w,py,px+w,py+h,r); ctx.arcTo(px+w,py+h,px,py+h,r);
  ctx.arcTo(px,py+h,px,py,r); ctx.arcTo(px,py,px+w,py,r); ctx.closePath();
}
function wrapCanvasText_(ctx,text,cx,y,maxW,lh){
  const words=String(text).split(' '); let line='';
  const lines=[];
  words.forEach(w=>{
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t;
  });
  if(line) lines.push(line);
  lines.slice(0,2).forEach((l,i)=>ctx.fillText(l, cx, y+i*lh));
}

document.getElementById('prev').onclick=()=>{calM--;if(calM<0){calM=11;calY--;}render();};
document.getElementById('next').onclick=()=>{calM++;if(calM>11){calM=0;calY++;}render();};
document.getElementById('today').onclick=()=>{calY=new Date().getFullYear();calM=new Date().getMonth();render();};
loadData();
setInterval(loadData, 60000);
document.getElementById('dayClose').onclick=()=>document.getElementById('dayOverlay').classList.remove('show');
document.getElementById('dayOverlay').onclick=e=>{if(e.target.id==='dayOverlay')e.target.classList.remove('show');};
document.getElementById('downloadImg').onclick=()=>downloadCalendarImage();
</script>
